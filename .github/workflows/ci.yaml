name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Deploy backend service on Render
        run: |
          curl -X POST "https://api.render.com/v1/services/${{ secrets.RENDER_BACKEND_SERVICE_ID }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{
              "imageUrl": "ghcr.io/naivedyavishwakarma/agentic-chatbot:${{ github.event.workflow_run.head_sha }}"
            }'

      - name: Deploy UI service on Render
        run: |
          curl -X POST "https://api.render.com/v1/services/${{ secrets.RENDER_UI_SERVICE_ID }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{
              "imageUrl": "ghcr.io/naivedyavishwakarma/agentic-chatbot:${{ github.event.workflow_run.head_sha }}"
            }'