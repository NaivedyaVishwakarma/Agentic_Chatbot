name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Deploy backend service on Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_BACKEND_SERVICE_ID }}
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            --header "Authorization: Bearer ${RENDER_API_KEY}" \
            --header "Content-Type: application/json" \
            --data "{\"imageUrl\":\"ghcr.io/naivedyavishwakarma/agentic-chatbot:${IMAGE_TAG}\"}"

      - name: Deploy UI service on Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_UI_SERVICE_ID }}
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            --header "Authorization: Bearer ${RENDER_API_KEY}" \
            --header "Content-Type: application/json" \
            --data "{\"imageUrl\":\"ghcr.io/naivedyavishwakarma/agentic-chatbot:${IMAGE_TAG}\"}"